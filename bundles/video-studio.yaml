name: video-studio
description: |
  Pipeline de edición profesional de video con Remotion.
  Crea contenido para YouTube, TikTok, Reels, Shorts, podcasts, tutoriales,
  entrevistas y motion graphics. Desde concepto hasta render final.
  Use when user says "quiero hacer un video", "editar video", "contenido para TikTok",
  "YouTube intro", "subtítulos animados", "transiciones", "lower thirds", o menciona Remotion.
skills:
  - remotion-video
  - frontend-design
  - grill-with-docs
  - zoom-out
  - qa-testing
instruction: |
  FASES SECUENCIALES — no avances sin autorización del usuario.

  ## Handoff
  - INPUT: Idea de video, script, clips grabados, audio, o referencia de estilo
  - OUTPUT: Video renderizado + proyecto fuente versionado en Git

  ## Transversal
  - Aplica `grill-with-docs` en FASE 0 para definir concepto, audiencia, estilo y formato
  - Aplica `frontend-design` en FASE 2 para definir paleta de colores, tipografía, espaciado y coherencia visual del video
  - Aplica `zoom-out` para validar que el concepto está completo antes de animar
  - Aplica `qa-testing` en FASE 5 para verificar legibilidad, sync de audio, y specs por plataforma

  ## FASE 0 — Concepto y Pre-Producción
  Antes de tocar código, definir con el usuario:

  1. **Carga `grill-with-docs`**. Interroga al usuario sobre:
     - ¿Qué tipo de contenido? (vlog, tutorial, entrevista, podcast, promo, meme, motion graphics)
     - ¿Para qué plataforma? (YouTube, TikTok, Reels, Shorts, LinkedIn, Twitter/X)
     - ¿Quién es la audiencia? (edad, idioma, nivel de conocimiento previo)
     - ¿Qué emoción/style busca? (divertido, profesional, minimalista, hype, calm)
     - ¿Qué assets tiene? (clips, audio, música, fotos, logo, transcripción)
     - ¿Qué duración aproximada?

  2. Determinar specs técnicos según plataforma:
     | Plataforma | Resolución | FPS | Ratio |
     |---|---|---|---|
     | YouTube landscape | 1920x1080 | 30/60 | 16:9 |
     | YouTube Shorts | 1080x1920 | 30/60 | 9:16 |
     | TikTok | 1080x1920 | 30 | 9:16 |
     | Reels / Stories | 1080x1920 | 30 | 9:16 |
     | Instagram Feed | 1080x1080 | 30 | 1:1 |
     | Twitter/X | 1280x720 | 30 | 16:9 |
     | LinkedIn | 1920x1080 | 30 | 16:9 |

  3. Crear storyboard frame-by-frame en texto:
     ```
     0-3s   → [elemento] + [animación] + [audio]
     3-8s   → [elemento] + [animación] + [audio]
     8-15s  → [elemento] + [transición] + [audio]
     ...
     ```

  4. Inventario de assets:
     - Video clips (qué clips, trim in/out)
     - Audio (voiceover, música, SFX)
     - Imágenes (fotos, logos, gráficos)
     - Subtítulos/captions (SRT existente o transcripción necesaria)

  Presenta concepto completo. **ESPERA aprobación del usuario antes de FASE 1.**

  ## FASE 1 — Setup de Proyecto
  Carga `remotion-video`.

  1. Scaffold proyecto:
     ```bash
     npx create-video@latest --yes --blank --no-tailwind [nombre-proyecto]
     ```

  2. Configurar composition en `src/Root.tsx` con specs definidos en FASE 0.

  3. Organizar assets en `public/`:
     ```
     public/
     ├── clips/
     │   ├── a-roll/
     │   └── b-roll/
     ├── audio/
     │   ├── voiceover.mp3
     │   ├── music.mp3
     │   └── sfx/
     ├── images/
     │   ├── logo.png
     │   └── photos/
     └── subtitles/
         └── captions.srt
     ```

  4. Crear estructura de componentes:
     ```
     src/
     ├── scenes/
     │   ├── Intro.tsx
     │   ├── MainContent.tsx
     │   └── Outro.tsx
     ├── components/
     │   ├── transitions/
     │   ├── subtitles/
     │   ├── lower-thirds/
     │   └── effects/
     ├── compositions/
     │   └── MainComposition.tsx
     ├── Root.tsx
     └── index.ts
     ```

  ## FASE 2 — Edición y Composición
  Construir timeline según storyboard:

  1. **Carga `frontend-design`** para definir el sistema visual del video:
     - Paleta de colores (máximo 3-4 colores: primario + neutros + acento)
     - Tipografía (sans-serif bold para títulos, legible en mobile)
     - Jerarquía de tamaños (headline > body > caption)
     - Espaciado consistente (padding seguro 60px, gap entre elementos)
     - Regla: si se ve genérico o "template de AI", rehacer

  2. Construir layers del timeline:
  - **A-roll**: Secuencia principal (entrevista, vlog, tutorial) con `<Video>`
  - **B-roll**: Overlays de clips secundarios en `<Sequence>` superpuestos
  - **Transiciones**: `@remotion/transitions` — fade, slide, wipe entre escenas
  - **Lower thirds**: Nombres, títulos, datos — entradas suaves con `interpolate`
  - **Subtítulos**: 
    - Estilo YouTube: `<Sequence>` por cue, fondo semitransparente
    - **Estilo TikTok**: `@remotion/captions` → `parseSrt()` + `createTikTokStyleCaptions()` → word-by-word highlight con `spring()` bounce
    - Karaoke: palabra resaltada progresivamente según timing exacto
  - **Color grading**: Overlays CSS (vignette, warm/cool tint, contrast)
  - **Premounting**: `<Sequence premountFor={30}>` para escenas que carguen assets pesados (videos, Lottie)

  **Timing principles:**
  - Entradas: 0.5-1.5s (15-45 frames @ 30fps)
  - Transiciones: 0.4-0.8s (12-25 frames)
  - Lower thirds hold: mínimo 2s
  - Ritmo TikTok: cortes cada 1-2s
  - Ritmo YouTube tutorial: cortes cada 3-5s

  ## FASE 3 — Audio y Sync
  1. Layer audio: voiceover + música + SFX
  2. Música de fondo: `<Audio volume={0.15-0.25}>` (no compita con voz)
  3. SFX en transiciones: cortos, volumen bajo
  4. Si hay subtítulos: sincronizar con voiceover frame-by-frame
  5. **Si es podcast/audiogram**: Agregar `Waveform` visualizer con `@remotion/media-utils`:
     ```tsx
     import { useAudioData, visualizeAudio } from "@remotion/media-utils";
     // 64 frequency bars sincronizadas con audio
     ```
  6. **Whisper auto-caption** (opcional): `npm run sub` en template TikTok para generar SRT automático

  ## FASE 4 — Review y Ajustes
  1. Render still frames en checkpoints:
     ```bash
     npx remotion still MainComp --frame=30 --scale=0.5
     npx remotion still MainComp --frame=150 --scale=0.5
     ```
  2. Preview completo:
     ```bash
     npx remotion studio
     ```
  3. Checklist de revisión:
     - [ ] Textos legibles a tamaño móvil (preview 50% scale)
     - [ ] Subtítulos no tapen elementos clave
     - [ ] Transiciones no cortan palabras a mitad
     - [ ] Audio sin clipping ni picos
     - [ ] Colores consistentes entre clips
     - [ ] Lower thirds no overlap entre sí

  ## FASE 5 — QA y Render
  Carga `qa-testing`.

  1. Verificar specs por plataforma:
     - Duración dentro de límites (YouTube Shorts: max 60s, TikTok: 10min)
     - Ratio correcto
     - FPS correcto
     - Tamaño de archivo estimado

  2. Render final:
     ```bash
     npx remotion render MainComp out/final.mp4
     ```

  3. Render thumbnail (`<Still>`):
     ```bash
     npx remotion still Thumbnail out/thumbnail.png --frame=[peak-frame]
     ```

  4. Variantes (si se necesitan):
     ```bash
     # Landscape para YouTube
     npx remotion render MainComp out/youtube.mp4 --props='{"format":"landscape"}'
     # Vertical para Shorts/Reels
     npx remotion render MainComp out/shorts.mp4 --props='{"format":"vertical"}'
     ```

  5. Cloud render (opcional):
     ```bash
     npx remotion lambda render <site-id> MainComp out/final.mp4
     ```

  6. Entregar:
     - Video MP4 (H.264, profile High, level 4.2)
     - Thumbnail PNG (1280x720)
     - Proyecto fuente en Git
     - Storyboard/script usado
     - Lista de assets y licencias
     - `calculateMetadata` logs (si se usó dynamic metadata)

  ## Output Format

  ```
  Proyecto: [nombre]
  Tipo: [vlog | tutorial | entrevista | podcast | promo | motion graphics | meme]
  Plataforma: [YouTube | TikTok | Reels | Shorts | LinkedIn | Twitter/X]
  Resolución: [WxH]
  FPS: [30 | 60]
  Duración: [X]s ([Y] frames)
  Escenas: [lista]
  Assets: [lista]
  Subtítulos: [SRT generado | manual | ninguno]
  Render: [local | lambda]
  Veredicto QA: [PASS/FAIL por item]
  ```