name: plan-sprint
description: Pipeline de planeación — contexto, PRD e issues.
skills:
- grill-with-docs
- to-prd
- to-issues
instruction: |
  FASES SECUENCIALES — no avances sin autorización explícita del usuario.

  ## Handoff
  - INPUT: Carpeta del proyecto (puede estar vacía)
  - OUTPUT: CONTEXT.md + PRD.md + issues.md

  ## Transversal
  Aplica `anti-hallucination` durante todo el pipeline.
  Ante duda sobre APIs/stack: Context7 → web_search → invisible-browser. Cita fuente siempre.
  Si hay skill de patrones para el stack detectado, úsala como fuente principal.

  ## FASE 1 — grill-with-docs
  Ejecuta el protocolo completo. Genera/actualiza CONTEXT.md con lenguaje ubicuo.
  Revisa ADRs previos si existen.
  ⚠️ Esta fase es inherentemente interactiva (multi-turno).
  En contexto kanban sin humano: ejecuta con preguntas esenciales, documenta supuestos en CONTEXT.md.
  GATE: usuario dice "pasa al PRD" o similar.

  ## FASE 2 — to-prd
  Con toda la info de FASE 1, genera PRD.md siguiendo el protocolo de to-prd.
  GATE: usuario aprueba PRD.

  ## FASE 3 — to-issues
  Desglosa PRD.md en vertical slices independientes.
  - Si hay repo + gh CLI autenticado → GitHub Issues
  - Si no → issues.md con numeración correlativa
  GATE: usuario confirma antes de publicar.
