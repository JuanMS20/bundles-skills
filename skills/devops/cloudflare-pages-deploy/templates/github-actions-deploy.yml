# GitHub Actions workflow: auto-deploy a Cloudflare Pages
# Copiar a .github/workflows/deploy.yml en el repo
# Reemplazar <nombre-proyecto> con el project name real
#
# GitHub Secrets necesarios (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — crear en dash.cloudflare.com/profile/api-tokens
#                           (template "Edit Cloudflare Workers" o custom con Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID — visible en el dashboard
#   VITE_* vars           — todas las env vars que el build necesita

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=<nombre-proyecto>
