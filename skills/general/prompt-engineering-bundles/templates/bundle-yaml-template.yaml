# Template: Bundle YAML de Alta Calidad
# Basado en research de skills quality (agentskills.io, Perplexity, SkillsBench)
# Aplicar estos criterios al crear o mejorar bundles

name: NOMBRE-BUNDLE
description: |
  Use when: [acción específica del usuario].
  Trigger phrases: [frases reales que usa el usuario].
  NOT [qué NO es este bundle].
skills:
  - skill-1
  - skill-2
instruction: |
  ## Contexto
  [1-2 oraciones sobre qué hace este bundle y cuándo usarlo]

  ## FASE 1 — [Nombre]
  [Pasos específicos, no genéricos]
  - [Paso concreto]
  - [Paso concreto]

  ## FASE 2 — [Nombre]
  [Pasos específicos]

  ## Output esperado
  ```
  ESTADO: PASSED | FAILED
  [Campos relevantes]

  | Campo | Valor |
  |-------|-------|
  | [nombre] | [valor] |

  BLOQUEANTES: [lista o "ninguno"]
  ```

  ## Gotchas
  - [Hecho real del entorno, no genérico]
  - [Error común y cómo prevenirlo]
  - [Limitación conocida]

  ## Verificación
  - [ ] [Check concreto 1]
  - [ ] [Check concreto 2]
  - [ ] [Check concreto 3]

  ## Si falla
  - [Error específico] → [acción correctiva]
  - No puedes verificar algo → DECLARAR qué no verificaste
